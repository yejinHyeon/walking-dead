name: survivor
description: "SURVIVOR — offline survival app for civilians in war and disaster zones."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_tts: ^4.2.5
  geolocator: ^14.1.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  torch_light: ^2.0.0
  url_launcher: ^6.3.3
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/ko/
    - assets/content/en/
    - assets/regions/korea/

