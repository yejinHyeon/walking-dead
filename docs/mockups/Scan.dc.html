<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카메라 스캔</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111315; color: #F1F0EC; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #1B1E22; border: 1px solid #2A2E34; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1F0EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="flex: 1; font-size: 18px; font-weight: 700">카메라 스캔</span>
  </div>
  <div style="display: flex; gap: 8px; padding: 4px; border-radius: 24px; background: #1B1E22; border: 1px solid #2A2E34">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>
  <div style="flex: 1 1 auto; border-radius: 24px; background: #1A1D20; position: relative; display: flex; align-items: center; justify-content: center; padding: 40px">
    <div style="position: absolute; left: 28px; top: 28px; width: 36px; height: 36px; border-left: 3px solid #F1F0EC; border-top: 3px solid #F1F0EC; border-radius: 8px 0 0 0"></div>
    <div style="position: absolute; right: 28px; top: 28px; width: 36px; height: 36px; border-right: 3px solid #F1F0EC; border-top: 3px solid #F1F0EC; border-radius: 0 8px 0 0"></div>
    <div style="position: absolute; left: 28px; bottom: 28px; width: 36px; height: 36px; border-left: 3px solid #F1F0EC; border-bottom: 3px solid #F1F0EC; border-radius: 0 0 0 8px"></div>
    <div style="position: absolute; right: 28px; bottom: 28px; width: 36px; height: 36px; border-right: 3px solid #F1F0EC; border-bottom: 3px solid #F1F0EC; border-radius: 0 0 8px 0"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <span style="font-size: 13px; color: #6E737A">[카메라 화면]</span>
      <span style="font-size: 17px; font-weight: 500; line-height: 1.5">{{hint}}</span>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
    <button aria-label="앨범에서 고르기" style="width: 52px; height: 52px; border-radius: 16px; border: 1px solid #2A2E34; background: #1B1E22; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1F0EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
    </button>
    <a href="{{href}}" aria-label="촬영" style="width: 80px; height: 80px; border-radius: 40px; border: 4px solid #F1F0EC; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <span style="width: 62px; height: 62px; border-radius: 31px; background: #F1F0EC; display: block"></span>
    </a>
    <button aria-label="플래시" style="width: 52px; height: 52px; border-radius: 16px; border: 1px solid #2A2E34; background: #1B1E22; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1F0EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
    </button>
  </div>
  <p style="margin: 0; font-size: 12px; color: #A9ADB3; text-align: center">사진은 이 폰 안에서만 분석되고, 어디에도 전송되지 않아요.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#F2C14E","#7FB2FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const modes = [
      { id: 'med', label: '약', hint: '약병이나 포장의 글자가 잘 보이게 찍어주세요', href: 'MedResult.dc.html' },
      { id: 'plant', label: '식물', hint: '잎, 줄기, 꽃이 함께 보이게 찍어주세요', href: 'PlantResult.dc.html' },
      { id: 'wound', label: '상처', hint: '피가 나면 지혈이 먼저예요. 밝은 곳에서 상처 전체가 보이게 찍어주세요', href: 'WoundResult.dc.html' }
    ];
    const picked = (this.state && this.state.m) || 'med';
    const cur = modes.find((x) => x.id === picked);
    return {
      hint: cur.hint,
      href: cur.href,
      modes: modes.map((x) => ({
        ...x,
        style: 'flex: 1; height: 44px; border-radius: 20px; border: 0; font: inherit; font-size: 15px; font-weight: 700; ' + (x.id === picked ? 'background: #F1F0EC; color: #111315;' : 'background: transparent; color: #A9ADB3;'),
        pick: () => this.setState({ m: x.id })
      }))
    };
  }
}
</script>
</body>
</html>
