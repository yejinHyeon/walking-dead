  <div style="border-radius: 18px; background: #1B1E22; border: 1px solid #2A2E34; padding: 16px; display: flex; flex-direction: column; gap: 8px">

        <span style="width: 40px; height: 40px; border-radius: 20px; background: #2A2E34; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #A9ADB3; flex: 0 0 auto">{{p.i}}</span>

          <span style="font-size: 15px; font-weight: 700">[이름] · [연락처]</span>
          <span style="font-size: 12px; color: #A9ADB3">혈액형 [  ] · 알레르기 [  ] · 복용약 [  ]</span>

  <a href="Kit.dc.html" style="height: 52px; border-radius: 16px; border: 1px solid #2A2E34; background: #1B1E22; color: #F1F0EC; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none">비상 배낭 준비하기 →</a>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#F2C14E","#7FB2FF"]},"$preview":{"width":390,"height":844}}'>
