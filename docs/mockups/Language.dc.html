<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>언어 선택 · Choose language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;family=Noto+Sans+Arabic:wght@400;700&amp;family=Noto+Sans+Hebrew:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111315; color: #F1F0EC; font-family: 'IBM Plex Sans KR', 'Noto Sans Arabic', 'Noto Sans Hebrew', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; padding: 64px 20px 32px; gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">언어를 선택하세요</h1>
    <p style="margin: 0; font-size: 16px; color: #A9ADB3">Choose your language</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="7">
      <button onClick="{{l.pick}}" dir="{{l.dir}}" style="{{l.style}}">
        <span style="display: flex; flex-direction: column; gap: 2px; text-align: start">
          <span style="font-size: 17px; font-weight: 700">{{l.native}}</span>
          <span style="font-size: 12px; color: #A9ADB3">{{l.status}}</span>
        </span>
        <span style="{{l.dot}}"></span>
      </button>
    </sc-for>
  </div>

  <a href="{{continueHref}}" style="height: 56px; border-radius: 18px; background: {{accent}}; color: #111315; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">{{continueLabel}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#F2C14E","#7FB2FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { id: 'ko', native: '한국어', dir: 'ltr', ready: true },
      { id: 'en', native: 'English', dir: 'ltr', ready: true },
      { id: 'uk', native: 'Українська', dir: 'ltr', ready: false },
      { id: 'ru', native: 'Русский', dir: 'ltr', ready: false },
      { id: 'ar', native: 'العربية', dir: 'rtl', ready: false },
      { id: 'fa', native: 'فارسی', dir: 'rtl', ready: false },
      { id: 'he', native: 'עברית', dir: 'rtl', ready: false }
    ];
    const picked = (this.state && this.state.picked) || 'ko';
    const accent = this.props.accent ?? '#FF8A3D';
    return {
      accent,
      langs: list.map((l) => {
        const on = l.id === picked;
        return {
          ...l,
          status: l.ready ? (picked === 'en' ? 'Saved for offline use' : '오프라인 저장됨') : (picked === 'en' ? '[Translation in progress]' : '[번역 준비 중]'),
          style: 'min-height: 60px; padding: 8px 16px; border-radius: 16px; font: inherit; color: #F1F0EC; display: flex; align-items: center; justify-content: space-between; gap: 12px; ' +
            (on ? 'background: #23272C; border: 2px solid ' + accent + ';' : 'background: #1B1E22; border: 1px solid #2A2E34;'),
          dot: 'width: 14px; height: 14px; border-radius: 7px; flex: 0 0 auto; ' + (on ? 'background: ' + accent + ';' : 'border: 2px solid #3A3F46; box-sizing: border-box;'),
          pick: () => this.setState({ picked: l.id })
        };
      }),
      continueHref: picked === 'en' ? 'MainEn.dc.html' : 'Main.dc.html',
      continueLabel: picked === 'en' ? 'Continue' : '계속하기'
    };
  }
}
</script>
</body>
</html>
