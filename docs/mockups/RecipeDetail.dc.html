<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>참치 라면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111315; color: #F1F0EC; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 12px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Recipes.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #1B1E22; border: 1px solid #2A2E34; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1F0EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="flex: 1; font-size: 18px; font-weight: 700">참치 라면 · 연료 절약</span>
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #23272C; font-size: 13px; display: flex; align-items: center">2명분</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #23272C; font-size: 13px; display: flex; align-items: center">불 약 5분</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #23272C; font-size: 13px; display: flex; align-items: center">물 500ml</span>
  </div>
  <div style="border-radius: 18px; background: #1B1E22; border: 1px solid #2A2E34; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #A9ADB3">재료</span>
    <span style="font-size: 15px; line-height: 1.6">라면 1개 · 참치 통조림 1개 · 물 500ml</span>
  </div>
  <div style="border-radius: 18px; background: #1B1E22; border: 1px solid #2A2E34; padding: 16px; display: flex; flex-direction: column; gap: 8px; gap: 12px">
    <span style="font-size: 13px; color: #A9ADB3">만들기</span>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #2A2E34; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: 0 0 auto">{{s.n}}</span>
        <span style="font-size: 15px; line-height: 1.5">{{s.t}}</span>
      </div>
    </sc-for>
  </div>
  <div style="border-radius: 18px; border: 2px solid {{accent}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 15px; font-weight: 700; color: {{accent}}">통조림 안전</span>
    <span style="font-size: 14px; line-height: 1.6">부풀었거나 새거나 심하게 찌그러진 캔, 열 때 거품이 나거나 냄새가 이상한 캔은 먹지 마세요. 닫힌 캔을 그대로 불에 올리면 터질 수 있어요.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#F2C14E","#7FB2FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF8A3D',
      steps: [
        { n: '1', t: '냄비에 물을 붓고 뚜껑을 덮어 끓이세요. 뚜껑을 덮으면 연료가 덜 들어요.' },
        { n: '2', t: '면을 넣고 1분 끓인 뒤 불을 끄고, 뚜껑을 덮은 채 4~5분 두면 남은 열로 익어요.' },
        { n: '3', t: '참치를 기름째 넣으세요. 기름도 소중한 열량이에요.' },
        { n: '4', t: '물이 부족하면 스프는 절반만 넣으세요. 짜면 갈증이 심해져요.' }
      ]
    };
  }
}
</script>
</body>
</html>
