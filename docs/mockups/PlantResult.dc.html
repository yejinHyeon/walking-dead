<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>식물 정보</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111315; color: #F1F0EC; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Scan.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #1B1E22; border: 1px solid #2A2E34; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1F0EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="flex: 1; font-size: 18px; font-weight: 700">식물 정보</span>
  </div>
  <div style="border-radius: 22px; background: {{accent}}; color: #111315; padding: 20px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 28px; font-weight: 700">먹지 마세요</span>
    <span style="font-size: 15px; font-weight: 500; line-height: 1.5">사진만으로는 먹어도 되는지 판단할 수 없어요. 독초를 잘못 먹으면 목숨이 위험해요.</span>
  </div>
  <div style="border-radius: 18px; background: #1B1E22; border: 1px solid #2A2E34; padding: 16px; display: flex; flex-direction: column; gap: 8px; flex-direction: row; align-items: center; gap: 14px">
    <div style="width: 72px; height: 72px; border-radius: 14px; border: 1px dashed #3A3F46; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #A9ADB3; flex: 0 0 auto">[사진]</div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 19px; font-weight: 700">[식물 이름]일 수 있어요</span>
      <span style="font-size: 13px; color: #A9ADB3">인식 확신도 낮음</span>
    </div>
  </div>
  <div style="border-radius: 18px; background: #1B1E22; border: 1px solid #2A2E34; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #A9ADB3">비슷하게 생긴 독초</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="height: 92px; border-radius: 12px; border: 1px dashed #3A3F46; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; color: #A9ADB3"><span>[독초 사진]</span><span style="color: #F1F0EC; font-weight: 700">[독초 이름]</span></div>
      <div style="height: 92px; border-radius: 12px; border: 1px dashed #3A3F46; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; color: #A9ADB3"><span>[독초 사진]</span><span style="color: #F1F0EC; font-weight: 700">[독초 이름]</span></div>
    </div>
  </div>
  <div style="border-radius: 18px; background: #1B1E22; border: 1px solid #2A2E34; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #A9ADB3">알려진 용도 (참고용)</span>
    <span style="font-size: 15px; line-height: 1.5">[전통적으로 알려진 용도] · 효과가 과학적으로 확인되지 않았을 수 있어요.</span>
  </div>
  <div style="border-radius: 18px; background: #1B1E22; border: 1px solid #2A2E34; padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #A9ADB3">먹었거나 만진 뒤 이상하면</span>
    <span style="font-size: 15px; line-height: 1.5">구토, 어지러움, 숨이 차면 바로 도움을 요청하세요. 먹은 식물을 챙겨 가면 치료에 도움이 돼요.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#F2C14E","#7FB2FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF8A3D' };
  }
}
</script>
</body>
</html>
