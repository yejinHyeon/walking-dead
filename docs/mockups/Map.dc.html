<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오프라인 지도 · Offline map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111315; color: #F1F0EC; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 620px; background: #16191C">
    <div style="position: absolute; left: 0; top: 150px; width: 390px; height: 14px; background: #23272C"></div>
    <div style="position: absolute; left: 0; top: 360px; width: 390px; height: 20px; background: #23272C"></div>
    <div style="position: absolute; left: 0; top: 500px; width: 390px; height: 10px; background: #23272C"></div>
    <div style="position: absolute; left: 110px; top: 0; width: 14px; height: 620px; background: #23272C"></div>
    <div style="position: absolute; left: 270px; top: 0; width: 18px; height: 620px; background: #23272C"></div>
    <div style="position: absolute; left: 140px; top: 190px; width: 110px; height: 150px; border-radius: 10px; background: #1A2A22"></div>
    <div style="position: absolute; left: 300px; top: 400px; width: 90px; height: 90px; border-radius: 6px; background: #1C2633"></div>
    <div style="position: absolute; left: 186px; top: 380px; width: 130px; height: 6px; background: #7FB2FF; transform: rotate(-58deg); transform-origin: left center; opacity: 0.8; border-radius: 3px"></div>

    <div style="position: absolute; left: 172px; top: 368px; width: 28px; height: 28px; border-radius: 14px; background: #F1F0EC; border: 5px solid #2B5DA8; box-sizing: border-box"></div>

    <div style="position: absolute; left: 236px; top: 238px; width: 40px; height: 40px; border-radius: 12px; background: #7FB2FF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111315" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M6 10v10h12V10"></path></svg>
    </div>
    <div style="position: absolute; left: 40px; top: 200px; width: 40px; height: 40px; border-radius: 12px; background: #7FB2FF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111315" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M6 10v10h12V10"></path></svg>
    </div>
    <div style="position: absolute; left: 310px; top: 520px; width: 38px; height: 38px; border-radius: 19px; background: #E8E4D8; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111315" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5"></path></svg>
    </div>
    <div style="position: absolute; left: 60px; top: 420px; width: 38px; height: 38px; border-radius: 19px; background: #E8E4D8; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111315" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z"></path></svg>
    </div>
    <div style="position: absolute; left: 200px; top: 90px; width: 38px; height: 38px; border-radius: 19px; background: #E8E4D8; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111315" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
    </div>
    <div style="position: absolute; left: 20px; top: 530px; width: 130px; height: 56px; border-radius: 12px; border: 2px dashed {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{accent}}; font-weight: 700; text-align: center">{{t.danger}}</div>
  </div>

  <div style="position: relative; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; align-items: center">
      <a href="{{links.home}}" aria-label="{{t.back}}" style="width: 44px; height: 44px; border-radius: 22px; background: #1B1E22; border: 1px solid #2A2E34; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1F0EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="flex: 1; min-width: 0; height: 44px; border-radius: 22px; background: #1B1E22; border: 1px solid #2A2E34; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #A9ADB3; white-space: nowrap; overflow: hidden">{{t.area}}</div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; background: #1B1E22; border-top: 1px solid #2A2E34; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #3A3F46; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #7FB2FF; font-weight: 500">{{t.kind}}</span>
        <span style="font-size: 20px; font-weight: 700">{{t.name}}</span>
        <span style="font-size: 14px; color: #A9ADB3">{{t.dist}}</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: #A9ADB3">
        <span>{{t.src}}</span>
        <span>{{t.agency}}</span>
        <span>{{t.date}}</span>
      </div>
    </div>
    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 52px; border-radius: 16px; border: 0; background: #7FB2FF; color: #111315; font: inherit; font-size: 16px; font-weight: 700">{{t.go}}</button>
      <button aria-label="{{t.save}}" style="width: 52px; height: 52px; border-radius: 16px; border: 1px solid #2A2E34; background: #15171A; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F1F0EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ko","en"],"default":"ko"},"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#F2C14E","#7FB2FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      ko: {
        danger: '위험 신고 구역', back: '뒤로', area: '저장된 지역 · [도시 이름] · [저장 날짜]',
        chips: ['대피소', '구호품', '물', '병원·약국'],
        kind: '민방위 대피소 · 지하', name: '[대피소 이름]', dist: '도보 6분 · 450m · 북동쪽',
        src: '정보 출처', agency: '[기관명]', date: '[확인 날짜]', go: '나침반으로 길 안내', save: '저장'
      },
      en: {
        danger: 'Reported danger', back: 'Back', area: 'Saved area · [City] · [Date saved]',
        chips: ['Shelters', 'Aid', 'Water', 'Medical'],
        kind: 'Public shelter · Underground', name: '[Shelter name]', dist: '6 min walk · 450 m · Northeast',
        src: 'Source', agency: '[Agency]', date: '[Verified date]', go: 'Guide me by compass', save: 'Save'
      }
    };
    const lang = this.props.lang === 'en' ? 'en' : 'ko';
    const t = S[lang];
    const picked = (this.state && this.state.picked) || 0;
    const base = 'height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; font-weight: 500; ';
    return {
      accent: this.props.accent ?? '#FF8A3D',
      t,
      links: { home: lang === 'en' ? 'MainEn.dc.html' : 'Main.dc.html' },
      chips: t.chips.map((label, k) => ({
        label,
        style: base + (k === picked
          ? 'background: #F1F0EC; color: #111315; border: 1px solid #F1F0EC;'
          : 'background: #1B1E22; color: #F1F0EC; border: 1px solid #2A2E34;'),
        pick: () => this.setState({ picked: k })
      }))
    };
  }
}
</script>
</body>
</html>
